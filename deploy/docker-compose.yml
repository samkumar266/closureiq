# Runs the whole app on the Akamai VM. Start it with deploy/deploy.sh from your laptop.
# The .env file lives only on the VM at /opt/closureiq/.env and is never committed.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: ../.env
    environment:
      DB_PATH: /app/data/closureiq.db     # Badri: read the database path from DB_PATH
    volumes:
      - ../data:/app/data                  # the decision record survives restarts
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "80:80"
      - "443:443"                          # used later if we add a domain name
    depends_on:
      - api
    restart: unless-stopped
